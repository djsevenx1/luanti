name: Build Minecraft APK

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gettext

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install NDK 29 (完整)
        run: |
          yes | sdkmanager "ndk;26.1.10909125" > /dev/null 2>&1 || true
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Build APKs
        run: cd android && ./gradlew assemblerelease

      - name: Sign APKs (debug keystore)
        run: |
          APK_DIR="android/app/build/outputs/apk/release"
          BT_DIR="$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | tail -1)"
          KEYSTORE="$HOME/.android/debug.keystore"
          # 若无 debug keystore 则用 keytool 生成
          if [ ! -f "$KEYSTORE" ]; then
            keytool -genkeypair -v -keystore "$KEYSTORE" -storepass android \
              -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Debug,O=Debug,C=US"
          fi
          for apk in "$APK_DIR"/*-unsigned.apk; do
            [ -f "$apk" ] || continue
            out="${apk/-unsigned/}"
            "$BT_DIR/zipalign" -f 4 "$apk" "${apk}.aligned"
            "$BT_DIR/apksigner" sign \
              --ks "$KEYSTORE" --ks-pass pass:android \
              --key-pass pass:android --ks-key-alias androiddebugkey \
              --out "$out" "${apk}.aligned"
            echo "已签名: $out"
          done

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          APK_DIR="android/app/build/outputs/apk/release"
          APKS=$(ls "$APK_DIR"/*.apk 2>/dev/null | grep -v -- '-unsigned' | tr '\n' ' ')
          if gh release view "$TAG" >/dev/null 2>&1; then
            for apk in $APKS; do gh release upload "$TAG" "$apk" --clobber; done
          else
            gh release create "$TAG" $APKS \
              --title "$TAG" \
              --generate-notes \
              --target "${{ github.sha }}"
          fi
